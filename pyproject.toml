[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-vlm"
version = "1.0.6"
description = "Temporal inference with Vision-Language Models — predict when an image was taken from its visual content."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Nidham Tekaya", email = "nidham.tekaya@fhstp.ac.at" },
]
keywords = [
    "vision-language-models", "temporal-reasoning", "CLIP",
    "time-estimation", "embedding-analysis", "bezier-curve",
    "computer-vision", "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=1.10.0",
    "torchvision>=0.11.0",
    "numpy>=1.19.0",
    "scipy>=1.5.0",
    "scikit-learn>=0.24.0",
    "Pillow>=8.0.0",
    "tqdm>=4.62.0",
    "umap-learn>=0.5.0",
    "matplotlib>=3.3.0",
    "tabulate>=0.8.9",
    "requests>=2.25.0",
]

[project.optional-dependencies]
# CLIP must be installed manually: pip install git+https://github.com/openai/CLIP.git
openclip = ["open-clip-torch>=2.24.0"]
all = [
    "open-clip-torch>=2.24.0",
    "optuna>=3.0.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
    "pyyaml>=5.4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/tekayanidham/timeline-vlm"
Documentation = "https://github.com/tekayanidham/timeline-vlm#readme"
Repository = "https://github.com/tekayanidham/timeline-vlm"
"Bug Tracker" = "https://github.com/tekayanidham/timeline-vlm/issues"
"Paper (ACM)" = "https://dl.acm.org/doi/10.1145/3746027.3758163"
"arXiv" = "https://arxiv.org/abs/2510.19559"
"Dataset (TIME10k)" = "https://osf.io/4th79/?view_only=560f540a7bac4d489faf164b16109642"

[project.scripts]
timeline-vlm = "timeline_vlm.cli:main"
timeline = "timeline_vlm.cli:main"

[tool.setuptools.packages.find]
include = ["timeline_vlm*"]

[tool.setuptools.package-data]
timeline_vlm = ["py.typed", "data/*.csv", "data/*.md"]
